name: CI

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd pi/backend
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio ruff mypy
    
    - name: Lint with ruff
      run: |
        cd pi/backend
        ruff check src/sota_cw/
      continue-on-error: true
    
    - name: Type check with mypy (optional)
      run: |
        cd pi/backend
        mypy src/sota_cw/ --ignore-missing-imports
      continue-on-error: true
    
    - name: Run pytest
      run: |
        cd pi/backend
        pytest tests/ -v --cov=src/sota_cw --cov-report=term-missing
      continue-on-error: true
    
    - name: Validate TX Quality CSV
      run: |
        python docs/test_reports/tools/validate_tx_quality_csv.py
    
    - name: Check for large VNA export files
      run: |
        echo "Checking for files > 5MB in test_reports/vna_exports..."
        find docs/test_reports/vna_exports -type f -size +5M -exec ls -lh {} \; || true
        echo "Consider using Git LFS for large files"
      continue-on-error: true

  firmware:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Keyer host tests (ohne Pico SDK)
      run: make -C firmware/pico_cw_keyer/test test

    - name: Install ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake ninja-build

    - name: Build Pico firmware (Pico SDK 2.1.1)
      run: |
        git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
        export PICO_SDK_PATH="$RUNNER_TEMP/pico-sdk"
        cmake -S firmware/pico_cw_keyer -B build/fw -G Ninja
        cmake --build build/fw

    - name: Upload UF2
      uses: actions/upload-artifact@v4
      with:
        name: pico_cw_keyer-uf2
        path: build/fw/pico_cw_keyer.uf2
